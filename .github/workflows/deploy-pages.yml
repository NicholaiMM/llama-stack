name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, feature/arcade-rebrand-and-donations ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploying the arcade-specific directory
          path: './amazinggracehomeliving'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
